<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contacto - Mi Tienda</title>

    <link rel="stylesheet" href="estilo.css">

</head>

<body>

    <header>

        <h1>WiTiendita</h1>

        <p>
            Papelería, regalos y productos creativos
        </p>

    </header>

    <nav>

        <a href="index.html">Inicio</a>

        <a href="nosotros.html">Nosotros</a>

        <a href="contacto.html">Contacto</a>

    </nav>

    <main>

        <section class="pagina">

            <h2>Contactanos</h2>

            <p>
                ¿Tenés alguna pregunta?
                Podés escribirnos.
            </p>

            <form>

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Escribí tu nombre"
                >

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Escribí tu email"
                >

                <label for="mensaje">
                    Mensaje
                </label>

                <textarea
                    id="mensaje"
                    rows="5"
                    placeholder="Escribí tu mensaje"
                ></textarea>

                <button type="submit">
                    Enviar mensaje
                </button>

            </form>

        </section>

        <section class="datos">

            <h2>También podés encontrarnos</h2>

            <p>
                Email: wiiiendita@gmail.com
            </p>

            <p>
                Instagram: @witiendita
            </p>

            <p>
                Horario: lunes a viernes
                de 9 a 18 hs.
            </p>

        </section>

    </main>

    <footer>

        <p>
            © 2026 WiTiendita
        </p>

    </footer>

</body>

</html>
